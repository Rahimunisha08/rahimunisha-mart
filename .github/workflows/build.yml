name: RahimunishaMart CI Pipeline

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build, Verify and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compile and Run Tests (Verification)
        run: mvn -B clean verify

      - name: Code Quality & Checkstyle Check
        run: mvn -B checkstyle:check
        continue-on-error: true

      - name: SpotBugs Static Analysis
        run: mvn -B spotbugs:check
        continue-on-error: true

      - name: Package Application (.WAR)
        run: mvn -B package -DskipTests
